version: "3.9"

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres

    restart: always

    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  streamlit:

    build: 
      context: .
      dockerfile: Dockerfile

    container_name: rag_streamlit

    depends_on:
      - postgres

    ports:
      - "8501:8501"

    env_file:
      - .env

    volumes:
      - ./:/workspace

volumes:
  postgres_data: